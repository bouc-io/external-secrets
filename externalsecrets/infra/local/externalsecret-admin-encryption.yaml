# LOCAL admin-api ENCRYPTION_KEY (pik8s, Kubernetes provider).
# OPTIONAL by design. admin-api falls back to storing provider API keys in plaintext
# with a warning when it is unset, which is exactly today's behaviour. It therefore
# lives in the NON-gating local-eso-infra-externalsecrets Kustomization: a missing key
# must never block every application from deploying. The Deployment reads it with
# optional: true for the same reason.
# Must be 32 bytes / 64 hex chars, e.g. openssl rand -hex 32.
# (Namespace is `default` like the app: the split here is about gating, not namespace.)
# key = source Secret name, property = data field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-admin-encryption
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-admin-encryption-secret
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: boucio-local-external-credentials
        property: boucio-admin-encryption-key
