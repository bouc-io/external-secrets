# LOCAL datadog-secret (pik8s, Kubernetes provider).
# Datadog Agent reads it via datadog.apiKeyExistingSecret.
# key = source Secret name, property = data field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: boucio-local-external-credentials
        property: boucio-datadog-api-key
