# SANDBOX datadog-secret (GKE, GCP Secret Manager).
# Second copy of the SAME key: Secrets are namespace-scoped and the OTel
# collector's Datadog exporter needs it in its own namespace.
# key = GCP secret name; the plain value is returned directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-datadog-secret
  namespace: opentelemetry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: boucio-datadog-api-key
