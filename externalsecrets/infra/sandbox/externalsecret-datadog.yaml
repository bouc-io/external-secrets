# SANDBOX datadog-secret (GKE, GCP Secret Manager).
# Datadog Agent reads it via datadog.apiKeyExistingSecret.
# key = GCP secret name; the plain value is returned directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: boucio-datadog-api-key
