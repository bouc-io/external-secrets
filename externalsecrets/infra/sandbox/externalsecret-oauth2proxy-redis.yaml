# SANDBOX oauth2-proxy-redis-secret (GKE, GCP Secret Manager).
# Bundled Bitnami Redis reads redis-password (the default key when
# redis.auth.existingSecretPasswordKey is empty). `username` is not a secret.
# key = GCP secret name; the plain value is returned directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-oauth2-proxy-redis-secret
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-redis-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: "admin"
  data:
    - secretKey: redis-password
      remoteRef:
        key: boucio-oauth2proxy-redis-password
