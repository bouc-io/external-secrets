# SANDBOX chatbot DB password (GKE — GCP Secret Manager). chatbot-api is legacy.
# key = GCP secret name; the plain value is returned directly (no property).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-chatbot-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-chatbot-db-secret
    creationPolicy: Owner
    # DATABASE_URL is assembled here so the password never lands in a ConfigMap.
    # mergePolicy: Merge is REQUIRED. It keeps the `password` key that the bundled
    # Postgres reads via postgresql.auth.existingSecret; without it the template
    # output replaces the data block and `password` disappears.
    # Host, user and database are not secrets. They mirror chatbot-api-chart's
    # snbx.values.yaml, so both must change together.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://ps_chatbot_snbx:{{ .password | toString | urlquery }}@chatbot-api-chart-postgresql.default.svc.cluster.local:5432/ps_chatbot_db_snbx"
  data:
    - secretKey: password
      remoteRef:
        key: boucio-chatbot-db-password
