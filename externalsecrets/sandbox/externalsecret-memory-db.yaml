# SANDBOX memory DB password (GKE — GCP Secret Manager).
# key = GCP secret name; the plain value is returned directly (no property).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-memory-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-memory-db-secret
    creationPolicy: Owner
    # DATABASE_URL is assembled here so the password never lands in a ConfigMap.
    # mergePolicy: Merge is REQUIRED. It keeps the `password` key that the bundled
    # Postgres reads via postgresql.auth.existingSecret; without it the template
    # output replaces the data block and `password` disappears.
    # Host, user and database are not secrets. They mirror memory-api-chart's
    # snbx.values.yaml, so both must change together.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://ps_memory_snbx:{{ .password | toString | urlquery }}@memory-api-chart-postgresql.default.svc.cluster.local:5432/ps_memory_db_snbx"
  data:
    - secretKey: password
      remoteRef:
        key: boucio-memory-db-password
