# SANDBOX admin-api Keycloak admin password (GKE, GCP Secret Manager).
# Required: admin-api throws "KEYCLOAK_ADMIN_PASSWORD is not configured" without it,
# so this lives in the app ExternalSecrets that sandbox-apps gates on.
# key = GCP secret name; the plain value is returned directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-admin-keycloak
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-admin-app-secret
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: boucio-keycloak-admin-password
