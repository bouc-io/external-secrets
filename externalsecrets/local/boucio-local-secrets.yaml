# LOCAL FILE-STORE (committed) — applied into the external-secrets namespace by
# the local-eso-externalsecrets Flux Kustomization. pik8s is not internet-exposed,
# so committing these local dev values in plaintext is acceptable.
#
# Each data key is the secret's NAME and MUST match the GCP Secret Manager secret
# name used in the sandbox, so the per-service ExternalSecrets line up across envs.
# Values here mirror each app's LOCAL (lcl.values.yaml) password.
#
# WHY THESE ARE TYPED BY HAND, AND MUST STAY THAT WAY
#
# On sandbox these same values are NOT typed: a Password generator mints them and a
# PushSecret writes them into GCP Secret Manager once (see generators/sandbox/ and
# the "Generated vs manual secrets" section of README.md). Local deliberately has no
# equivalent. This is a decision, not an oversight.
#
# The reason is durability. ESO generators keep no state: every invocation produces
# a new value. Sandbox gets away with generating because GCP Secret Manager is an
# external source of truth that outlives the Secret, the namespace and the cluster,
# so the value is minted once and read back forever. Local's only source of truth is
# THIS FILE. A generator here would leave the value living in a Kubernetes Secret
# and nowhere else.
#
# The consequence if someone wires one up anyway: the bundled Postgres bakes its
# password into the PVC at first init, so a regenerated value no longer matches the
# database that holds your local data. The app CrashLoops with an auth error, the
# data is intact but unreachable, and recovery is a manual ALTER USER against each
# affected database.
#
# If you want the generated pattern, generators/sandbox/ is the reference
# implementation. Do not port it here.
apiVersion: v1
kind: Secret
metadata:
  name: boucio-local-secrets
  namespace: external-secrets
type: Opaque
stringData:
  boucio-agent-db-password: "admin"
  boucio-memory-db-password: "admin"
  boucio-chatbot-db-password: "admin"
  boucio-admin-db-password: "admin"
  boucio-portal-db-password: "portal"
  # admin-api's Keycloak admin password. Same throwaway local value the chart used
  # to carry as a literal. Real third-party credentials do NOT belong in this file:
  # they go in the gitignored boucio-local-external-credentials.yaml instead.
  boucio-keycloak-admin-password: "admin"
  # Password for the Redis bundled with agent-api (BullMQ job queues). Same
  # throwaway local value agent-api-chart used to carry as a literal.
  boucio-agent-redis-password: "admin"
