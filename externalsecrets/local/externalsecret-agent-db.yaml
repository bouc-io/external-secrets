# LOCAL agent DB password (pik8s — Kubernetes provider).
# key = source Secret name (boucio-local-secrets), property = data field.
#
# The value is hand-authored, unlike sandbox where it is generated. See the header
# of boucio-local-secrets.yaml for why, and why a generator here would lock the app
# out of the existing local database. The same applies to every ExternalSecret in
# this directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-agent-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-agent-db-secret
    creationPolicy: Owner
    # DATABASE_URL is assembled here so the password never lands in a ConfigMap.
    # mergePolicy: Merge is REQUIRED. It keeps the `password` key that the bundled
    # Postgres reads via postgresql.auth.existingSecret; without it the template
    # output replaces the data block and `password` disappears.
    # Host, user and database are not secrets. They mirror agent-api-chart's
    # lcl.values.yaml, so both must change together.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://ps_agent:{{ .password | toString | urlquery }}@agent-api-chart-postgresql.default.svc.cluster.local:5432/ps_agent_db"
  data:
    - secretKey: password
      remoteRef:
        key: boucio-local-secrets
        property: boucio-agent-db-password
