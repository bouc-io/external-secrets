# LOCAL admin-api Keycloak admin password (pik8s, Kubernetes provider).
# Required: admin-api throws "KEYCLOAK_ADMIN_PASSWORD is not configured" without it,
# so this lives in the app ExternalSecrets that local-apps gates on.
# key = source Secret name, property = data field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-admin-keycloak
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-admin-app-secret
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: boucio-local-secrets
        property: boucio-keycloak-admin-password
