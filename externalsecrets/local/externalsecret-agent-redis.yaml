# LOCAL agent Redis password (pik8s — Kubernetes provider).
# key = source Secret name (boucio-local-secrets), property = data field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-agent-redis
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-agent-redis-secret
    creationPolicy: Owner
    # REDIS_URL is assembled here so the password never lands in a ConfigMap.
    # mergePolicy: Merge is REQUIRED. It keeps the `redis-password` key that the
    # bundled Redis reads via redis.auth.existingSecret; without it the template
    # output replaces the data block and `redis-password` disappears.
    # `redis-password` carries a hyphen, so it is read with `index`, not dot access.
    # Host and port are not secrets. The host mirrors agent-api-chart's
    # `agent-api-chart.redis.endpoint` helper, so both must change together.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        REDIS_URL: "redis://:{{ index . \"redis-password\" | toString | urlquery }}@agent-api-chart-redis-master.default.svc.cluster.local:6379"
  data:
    - secretKey: redis-password
      remoteRef:
        key: boucio-local-secrets
        property: boucio-agent-redis-password
