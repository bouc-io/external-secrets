# LOCAL admin DB password (pik8s — Kubernetes provider).
# key = source Secret name (boucio-local-secrets), property = data field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boucio-admin-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: boucio-store
    kind: ClusterSecretStore
  target:
    name: boucio-admin-db-secret
    creationPolicy: Owner
    # DATABASE_URL is assembled here so the password never lands in a ConfigMap.
    # mergePolicy: Merge is REQUIRED. It keeps the `password` key that the bundled
    # Postgres reads via postgresql.auth.existingSecret; without it the template
    # output replaces the data block and `password` disappears.
    # Host, user and database are not secrets. They mirror admin-api-chart's
    # lcl.values.yaml, so both must change together.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://ps_admin:{{ .password | toString | urlquery }}@admin-api-chart-postgresql.default.svc.cluster.local:5432/ps_admin_db"
  data:
    - secretKey: password
      remoteRef:
        key: boucio-local-secrets
        property: boucio-admin-db-password
