# SANDBOX oauth2-proxy Redis password — generated, then pushed to GCP Secret Manager.
# Read back by externalsecrets/infra/sandbox/externalsecret-oauth2proxy-redis.yaml,
# which is unchanged. See pushsecret-agent-db.yaml for the full rationale.
#
# This one is consumed by the INFRA ExternalSecret set (namespace oauth2-proxy).
# That Kustomization deliberately does NOT dependsOn the generators Kustomization:
# it is the non-gating set, so coupling it here would let a generator problem
# block the unrelated Datadog key too. Its ExternalSecret just retries until this
# PushSecret has landed the value in Secret Manager.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: boucio-oauth2proxy-redis-password
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: boucio-store
      kind: ClusterSecretStore
  # Generate once; never overwrite an existing GCP secret.
  updatePolicy: IfNotExists
  # A Flux prune must never delete the GCP secret.
  deletionPolicy: None
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: boucio-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: boucio-oauth2proxy-redis-password
