# SANDBOX password generator.
#
# Mints the machine-only values nobody ever reads back: the five DB passwords and
# the two Redis passwords. It is consumed ONLY by the PushSecrets in this
# directory, which write the value into GCP Secret Manager once. The existing
# ExternalSecrets under externalsecrets/sandbox/ keep reading GCP Secret Manager
# and are unchanged.
#
# Why not point an ExternalSecret straight at this generator: ESO generators are
# stateless ("the generator does not keep track of the produced values; every
# invocation produces a new set of values"). A generator wired directly to an
# ExternalSecret therefore mints a NEW password whenever the target Secret is
# recreated, while the bundled Postgres still has the old one baked into its PVC.
# Pushing to GCP Secret Manager gives the value a durable home that outlives the
# Secret, the namespace and the cluster.
#
# LOCAL deliberately has no equivalent — see the header of
# externalsecrets/local/boucio-local-secrets.yaml.
#
# Namespaced (not a ClusterGenerator) because every PushSecret that references it
# lives in this same namespace.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: boucio-password
  namespace: external-secrets
spec:
  length: 32
  digits: 6
  # No symbols on purpose. These values land in DSNs, psql arguments and
  # redis-cli invocations. The ExternalSecret templates already url-encode them,
  # but a 32-character alphanumeric still carries ample entropy and stays safe
  # everywhere it gets pasted.
  symbols: 0
  noUpper: false
  # Required at this length: without it the generator can exhaust its retry loop
  # trying to place 32 non-repeating characters.
  allowRepeat: true
