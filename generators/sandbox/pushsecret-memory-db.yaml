# SANDBOX memory DB password — generated, then pushed to GCP Secret Manager.
# Read back by externalsecrets/sandbox/externalsecret-memory-db.yaml, which is
# unchanged. See pushsecret-agent-db.yaml for the full rationale.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: boucio-memory-db-password
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: boucio-store
      kind: ClusterSecretStore
  # Generate once; never overwrite an existing GCP secret.
  updatePolicy: IfNotExists
  # A Flux prune must never delete the GCP secret.
  deletionPolicy: None
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: boucio-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: boucio-memory-db-password
