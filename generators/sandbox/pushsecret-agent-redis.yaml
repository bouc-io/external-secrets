# SANDBOX agent Redis password — generated, then pushed to GCP Secret Manager.
# Read back by externalsecrets/sandbox/externalsecret-agent-redis.yaml, which is
# unchanged and assembles REDIS_URL from it. See pushsecret-agent-db.yaml for the
# full rationale.
#
# Note the asymmetry with the DB secrets: the ExternalSecret exposes this under
# the key `redis-password` (what the bundled Redis expects), but the generator
# always produces `password`. The rename happens on the read side, so the
# secretKey here stays `password`.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: boucio-agent-redis-password
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: boucio-store
      kind: ClusterSecretStore
  # Generate once; never overwrite an existing GCP secret.
  updatePolicy: IfNotExists
  # A Flux prune must never delete the GCP secret.
  deletionPolicy: None
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: boucio-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: boucio-agent-redis-password
