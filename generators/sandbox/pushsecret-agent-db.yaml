# SANDBOX agent DB password — generated, then pushed to GCP Secret Manager.
#
# Flow:  Password generator -> PushSecret -> GCP Secret Manager
#                                                  |
#                              externalsecrets/sandbox/externalsecret-agent-db.yaml
#                                                  |
#                                    Secret boucio-agent-db-secret
#
# The ExternalSecret is NOT modified by this: remoteKey below is exactly the GCP
# secret name it already reads. This file only replaces the manual
# `gcloud secrets create boucio-agent-db-password` step.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: boucio-agent-db-password
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: boucio-store
      kind: ClusterSecretStore
  # BOTH policies below are load-bearing. Do not drop either one.
  #
  # IfNotExists: create the GCP secret only when it is absent. The generator still
  # mints a fresh random value on every refresh, but it is discarded instead of
  # written, so the password the cluster actually uses never changes underneath a
  # Postgres PVC. It also makes this safe to apply to a project where the secret
  # was already created by hand: the existing value wins.
  updatePolicy: IfNotExists
  # None: deleting this PushSecret (a rename, a directory restructure, a Flux
  # prune) must never delete the GCP secret. The GCP copy is the durable one.
  deletionPolicy: None
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: boucio-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: boucio-agent-db-password
