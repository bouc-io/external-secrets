# SANDBOX (GKE) backend pointer — GCP Secret Manager provider.
# Auth is "core controller" Workload Identity: no auth block here; the ESO
# controller ServiceAccount is WI-annotated via snbx.values.yaml and impersonates
# the eso-gke Google service account (granted roles/secretmanager.secretAccessor).
# See README.md for the manual GCP setup.
#
# Named "boucio-store" — the SAME name as the local store — so the
# ExternalSecret manifests reference one store name in both clusters.
#
# ${GCP_PROJECT_ID} is substituted by Flux (postBuild.substituteFrom cluster-vars)
# on the eso-stores Kustomization. Document the variable in the fluxcd README.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: boucio-store
spec:
  provider:
    gcpsm:
      projectID: "${GCP_PROJECT_ID}"
