# LOCAL (pik8s) backend pointer — Kubernetes provider.
# Reads the boucio-local-secrets Secret from the external-secrets namespace (the
# local file-store lives alongside the operator) and projects requested keys.
#
# Named "boucio-store" — the SAME name as the sandbox store — so the
# ExternalSecret's secretStoreRef is identical in both clusters.
#
# READ-ONLY BY DESIGN. No PushSecret targets this store, unlike sandbox where the
# generators/sandbox/ PushSecrets write into GCP Secret Manager. There is nothing
# to write to here: this provider's backing store is boucio-local-secrets.yaml,
# a file committed to this repo, not an external system. See that file's header
# for the full reasoning.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: boucio-store
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      # server.url defaults to the in-cluster API (kubernetes.default), so only
      # the CA needs to be provided. kube-root-ca.crt is auto-published into
      # every namespace by Kubernetes.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
