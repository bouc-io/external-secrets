# TEMPLATE for the LOCAL source of REAL third-party credentials.
#
# Why this is separate from externalsecrets/local/boucio-local-secrets.yaml:
# that file is committed on purpose (it holds throwaway pik8s dev DB passwords,
# and pik8s is not internet-exposed). This repo is also mirrored to a PUBLIC
# GitHub remote, so live third-party credentials must never go in it.
#
# The values below are real credentials for services outside the cluster
# (Datadog, and the oauth2-proxy Redis). Keep them out of Git:
#   1. Copy this file to boucio-local-external-credentials.yaml (gitignored).
#   2. Fill in the values.
#   3. kubectl apply -f boucio-local-external-credentials.yaml
#
# This replaces the separate `kubectl create secret` steps that the datadog,
# opentelemetry and oauth2-proxy READMEs used to document: ESO now fans this one
# Secret out to the target Secrets in their namespaces.
#
# NOT here: the Keycloak `kiali-client` secret consumed by Kiali and Grafana.
# Keycloak owns that one, and the keycloak-kiali-sync post-install hook Job in
# infrastructure/keycloak writes both target Secrets directly.
#
# On sandbox there is no equivalent file. The same keys live in GCP Secret
# Manager under the same names (see the gcloud block in README.md).
apiVersion: v1
kind: Secret
metadata:
  name: boucio-local-external-credentials
  namespace: external-secrets
type: Opaque
stringData:
  # Datadog API key. Fans out to `datadog-secret` (key api-key) in BOTH the
  # datadog and opentelemetry namespaces.
  boucio-datadog-api-key: "<DATADOG_API_KEY>"

  # Password for the Redis bundled with oauth2-proxy. Fans out to
  # `oauth2-proxy-redis-secret` (key redis-password).
  boucio-oauth2proxy-redis-password: "<REDIS_PASSWORD>"

  # admin-api ENCRYPTION_KEY: encrypts LLM provider API keys at rest in the admin DB.
  # Must be 32 bytes / 64 hex chars: openssl rand -hex 32
  # Optional. Leave the whole key out and admin-api stores provider API keys in
  # plaintext with a warning, which is the behaviour before this was wired up.
  # It lives here rather than in the committed file precisely because a real
  # encryption key must never reach the public mirror.
  boucio-admin-encryption-key: "<64_HEX_CHARS>"
